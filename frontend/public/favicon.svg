<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="15 分钟生活圈">
  <!-- 与站点同一套色：低饱和青绿底 + 三层等时圈环 + 中心点标记 -->
  <rect width="64" height="64" rx="14" fill="#4e807a"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="21" stroke="#7ea87e" stroke-width="3" stroke-dasharray="20 8"/>
    <circle cx="32" cy="32" r="14" stroke="#7fa6c0" stroke-width="3" stroke-dasharray="14 6"/>
    <circle cx="32" cy="32" r="7.5" stroke="#cfa257" stroke-width="3"/>
  </g>
  <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
  <text x="32" y="53" font-family="Bahnschrift, DIN Alternate, Arial, sans-serif" font-size="13"
        font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">15′</text>
</svg>
