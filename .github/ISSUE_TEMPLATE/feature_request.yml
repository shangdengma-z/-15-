name: 功能建议 / Feature Request
description: 提出新功能、算法改进或新的分析维度
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看一眼 [ROADMAP.md](../../ROADMAP.md)，避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      placeholder: 谁在什么场景下遇到什么困难，而不是"希望加个 XX 按钮"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      description: 涉及算法的请说明思路；涉及地图 API 的请注明会新增哪些接口调用
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: 对配额的额外影响
      description: 步行路线规划仅 3 QPS / 5000 次每天，新增调用量必须计入
      options:
        - 不新增 API 调用
        - 新增少量（每次分析 < 50 次）
        - 新增大量（> 50 次，需要重新评估采样策略）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 替代方案与不做什么的代价
