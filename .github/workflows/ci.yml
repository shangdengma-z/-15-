name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    # 格式守门放在最前面：它只要 python 标准库，几秒钟出结果，
    # 而 ruff format / prettier 那种"重排整个文件"的格式化会洗掉 blame，所以不跑那种。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Style & convention check
        run: python scripts/check_style.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app backend/tests scripts --select E,F,W --ignore E501,E402
      - name: Agent offline self-test (mock map + fake LLM)
        run: python backend/tests/test_agent_offline.py
      - name: Standards & site-advisor offline self-test (mock map)
        run: python backend/tests/test_modules_offline.py
      - name: Auth layer offline self-test (no DB required)
        run: python backend/tests/test_auth_offline.py
      - name: Place search offline self-test (mock map)
        run: python backend/tests/test_search_offline.py
      - name: Account layer on SQLite (no MySQL, no secrets)
        run: python backend/tests/test_auth_sqlite.py
      - name: Multi-user HTTP isolation on SQLite (mock map)
        run: python backend/tests/test_auth_http.py
      - name: Persistence & scenario offline self-test (temp SQLite)
        run: python backend/tests/test_persistence_offline.py
      - name: Smoke test (mock mode)
        env:
          BMAP_MOCK: '1'
          BMAP_QPS: '1000'
        run: |
          timeout 20 uvicorn app.main:app --app-dir backend &
          sleep 3
          curl -sf http://localhost:8000/api/health | grep '"ok":true'
          JOB=$(curl -sf -X POST http://localhost:8000/api/analysis -H 'Content-Type: application/json' -d '{"lat":39.908,"lng":116.397}' | python -c 'import sys,json;print(json.load(sys.stdin)["job_id"])')
          sleep 2
          curl -sf http://localhost:8000/api/analysis/$JOB | head -c 400

      - name: Full-chain report assertion (runs with zero API key)
        env:
          BMAP_MOCK: '1'
          BMAP_QPS: '1000'
        run: |
          uvicorn app.main:app --app-dir backend --port 8001 &
          SERVER=$!
          sleep 4
          python scripts/ci_full_chain.py http://127.0.0.1:8001; RC=$?
          kill $SERVER
          exit $RC

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: |
          cd frontend
          npm install
          npm run build

  image:
    # 线上跑的就是 Dockerfile.single 这一个镜像：CI 里真构建 + 真起容器，
    # "能部署"就不只是我本机的一次运气。刻意不 push——镜像仓库是私有的，CI 无凭据也不该有。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build single image
        run: docker build -f Dockerfile.single -t circle15:ci .
      - name: Run and probe it
        run: |
          docker run -d --name ci-app -p 8090:8000 -e BMAP_MOCK=1 -e BMAP_QPS=1000 circle15:ci
          for i in $(seq 1 15); do
            sleep 2
            curl -sf http://localhost:8090/api/health | grep '"ok":true' && break
          done
          curl -sf http://localhost:8090/api/health | grep '"ok":true'
          # 静态站与 API 同一个进程：首页拿得到，且带上了运行时注入密钥的那段脚本
          curl -sf http://localhost:8090/ | grep -q 'src="/env.js"'
          docker logs ci-app | tail -5
