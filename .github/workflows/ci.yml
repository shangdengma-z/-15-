name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app --select E,F,W --ignore E501
      - name: Agent offline self-test (mock map + fake LLM)
        run: python backend/tests/test_agent_offline.py
      - name: Standards & site-advisor offline self-test (mock map)
        run: python backend/tests/test_modules_offline.py
      - name: Auth layer offline self-test (no DB required)
        run: python backend/tests/test_auth_offline.py
      - name: Place search offline self-test (mock map)
        run: python backend/tests/test_search_offline.py
      - name: Account layer on SQLite (no MySQL, no secrets)
        run: python backend/tests/test_auth_sqlite.py
      - name: Multi-user HTTP isolation on SQLite (mock map)
        run: python backend/tests/test_auth_http.py
      - name: Persistence & scenario offline self-test (temp SQLite)
        run: python backend/tests/test_persistence_offline.py
      - name: Smoke test (mock mode)
        env:
          BMAP_MOCK: '1'
          BMAP_QPS: '1000'
        run: |
          timeout 20 uvicorn app.main:app --app-dir backend &
          sleep 3
          curl -sf http://localhost:8000/api/health | grep '"ok":true'
          JOB=$(curl -sf -X POST http://localhost:8000/api/analysis -H 'Content-Type: application/json' -d '{"lat":39.908,"lng":116.397}' | python -c 'import sys,json;print(json.load(sys.stdin)["job_id"])')
          sleep 2
          curl -sf http://localhost:8000/api/analysis/$JOB | head -c 400

      - name: Full-chain report assertion (runs with zero API key)
        env:
          BMAP_MOCK: '1'
          BMAP_QPS: '1000'
        run: |
          timeout 30 uvicorn app.main:app --app-dir backend --port 8001 &
          sleep 3
          JOB=$(curl -sf -X POST http://localhost:8001/api/analysis -H 'Content-Type: application/json' \
                -d '{"lat":40.0703,"lng":116.3306}' | python -c 'import sys,json;print(json.load(sys.stdin)["job_id"])')
          for i in $(seq 1 20); do
            sleep 2
            curl -sf http://localhost:8001/api/analysis/$JOB | python -c '
import sys, json
d = json.load(sys.stdin)
if d["status"] != "done":
    sys.exit(1)
r = d["result"]
assert len(r["rings"]["15"]) >= 12, "等时圈顶点不足"
assert r["coverage"] and all(v["total"] >= 0 for v in r["coverage"].values()), "覆盖统计缺失"
assert "missing" in json.dumps(r["blindspots"], ensure_ascii=False) or r["blindspots"] == [], "盲区字段异常"
cl = r["blindspot_clusters"]
assert sum(c["cells"] for c in cl) == len(r["blindspots"]), "片区聚合丢格/重计"
assert all(c["cells"] >= 1 and c["area_km2"] > 0 and "missing" in c for c in cl), "片区字段不完整"
assert len(r["meta"]["evidence_id"]) == 16, "证据指纹缺失"
sc = r["scenarios"]["by_crowd"]
assert sc["elderly"]["area_km2"] < sc["adult"]["area_km2"], "人群步速换算方向错误"
assert r["scenarios"]["api_calls_for_scenarios"] == 0, "情景重算不应出网"
assert r["metrics"] and all("formula" in m for m in r["metrics"]), "可解释指标缺公式"
std = r["standards"]
assert std["total"] >= 5 and std["method"], "导则达标对照缺失"
assert all(i["ref_m"] > 0 and i["status"] in ("达标", "临界", "缺口", "无点位") for i in std["items"]), "导则状态取值异常"
assert std["passed"] == sum(1 for i in std["items"] if i["status"] == "达标"), "达标计数不自洽"
print("零密钥全链路 OK：健康分", r["health_score"], "| 盲区", len(r["blindspots"]),
      "处 | 导则达标", std["passed"], "/", std["total"],
      "项 | 等时圈顶点", len(r["rings"]["15"]), "| 热力点", len(r["heat"]),
      "| 老人/成人面积", sc["elderly"]["area_km2"], "/", sc["adult"]["area_km2"])
' && exit 0
          done
          echo "全链路体检未在 40s 内完成" && exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: |
          cd frontend
          npm install
          npm run build
