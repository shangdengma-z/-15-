name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app --select E,F,W --ignore E501
      - name: Agent offline self-test (mock map + fake LLM)
        run: python backend/tests/test_agent_offline.py
      - name: Smoke test (mock mode)
        env:
          BMAP_MOCK: '1'
          BMAP_QPS: '1000'
        run: |
          pip install -r backend/requirements.txt
          timeout 20 uvicorn app.main:app --app-dir backend &
          sleep 3
          curl -sf http://localhost:8000/api/health | grep '"ok":true'
          JOB=$(curl -sf -X POST http://localhost:8000/api/analysis -H 'Content-Type: application/json' -d '{"lat":39.908,"lng":116.397}' | python -c 'import sys,json;print(json.load(sys.stdin)["job_id"])')
          sleep 2
          curl -sf http://localhost:8000/api/analysis/$JOB | head -c 400

      - name: Full-chain report assertion (runs with zero API key)
        env:
          BMAP_MOCK: '1'
          BMAP_QPS: '1000'
        run: |
          pip install -r backend/requirements.txt
          timeout 30 uvicorn app.main:app --app-dir backend --port 8001 &
          sleep 3
          JOB=$(curl -sf -X POST http://localhost:8001/api/analysis -H 'Content-Type: application/json' \
                -d '{"lat":40.0703,"lng":116.3306}' | python -c 'import sys,json;print(json.load(sys.stdin)["job_id"])')
          for i in $(seq 1 20); do
            sleep 2
            curl -sf http://localhost:8001/api/analysis/$JOB | python -c '
import sys, json
d = json.load(sys.stdin)
if d["status"] != "done":
    sys.exit(1)
r = d["result"]
assert len(r["rings"]["15"]) >= 12, "等时圈顶点不足"
assert r["coverage"] and all(v["total"] >= 0 for v in r["coverage"].values()), "覆盖统计缺失"
assert "missing" in json.dumps(r["blindspots"], ensure_ascii=False) or r["blindspots"] == [], "盲区字段异常"
print("零密钥全链路 OK：健康分", r["health_score"], "| 盲区", len(r["blindspots"]),
      "处 | 等时圈顶点", len(r["rings"]["15"]), "| 热力点", len(r["heat"]))
' && exit 0
          done
          echo "全链路体检未在 40s 内完成" && exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: |
          cd frontend
          npm install
          npm run build
