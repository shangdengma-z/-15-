# 上线编排：db + backend + fe + proxy 四个服务，只有 proxy 对外听 80/443。
#
# 在仓库根目录执行（--project-directory 让 ${...} 从根 .env 取值，路径仍相对本文件解析）：
#   docker compose --project-directory . -f deploy/docker-compose.prod.yml up -d --build
#   docker compose --project-directory . -f deploy/docker-compose.prod.yml logs -f backend
#
# 服务器已有 MySQL 时：删掉下面的 db 服务，并把 backend.environment.DB_HOST 改成真实地址。
# 3306 全程不发布到宿主机端口，公网扫不到。

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # 2G 内存的机器上，默认配置的 MySQL 8 光 performance_schema + binlog 就要吃掉一半
    command: --config-file=/etc/mysql/conf.d/app.cnf
    env_file: ../.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-circle15}
      MYSQL_USER: ${DB_USER:-circle}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在根 .env 里设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在根 .env 里设置 DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/app.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # 容器里的"本机"不是宿主机：这一项覆盖 .env 里的 DB_HOST=127.0.0.1
      DB_HOST: db
    volumes:
      - ../data/cache:/srv/data/cache     # API 结果缓存：同一社区重跑 0 配额
      - ../data/db:/srv/data/db           # 档案库（SQLite）：上线后按用户分子目录
      - ../backup:/srv/backup             # 只给 deploy/backup.sh 用：容器里写出的副本落到宿主机
    depends_on:
      db:
        condition: service_healthy
    # 刻意不写 ports：后端只经 proxy 暴露，避免绕过 TLS 直接打到 :8000

  fe:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # 只有"浏览器端类型"的地图 AK 会被编译进静态包（展示地图要用），
        # 服务端 REST 的 AK 绝不进镜像；这个 AK 必须配 Referer 白名单
        VITE_BMAP_AK: ${VITE_BMAP_AK:-}
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - fe
      - backend

volumes:
  dbdata:
