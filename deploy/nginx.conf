# 上线用边缘代理：TLS 终结 + 静态资源走前端容器 + /api 走后端容器。
# 域名改两处 server_name 与证书路径；证书用 certbot 申请后把目录挂进本容器（见 deploy/server-setup.sh）。
#
# 为什么不让前端容器直接听 443：会话 cookie 的 Secure 位由后端的 X-Forwarded-Proto 决定，
# 只在前端容器里配一次 TLS 的话，改配置要重新构建镜像；边缘单独一层，换证书不用碰镜像。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name circle.example.com;          # ← 改成你的域名

    # certbot 续期用 http-01，这条路径必须留在 HTTP 上
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name circle.example.com;          # ← 同上

    ssl_certificate     /etc/letsencrypt/live/circle.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circle.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:4m;
    ssl_session_timeout 1h;

    # 后端读到 https 才会给 sid / csrf 两个 cookie 打 Secure 位，
    # 少了这一行，明文 HTTP 请求也能带上会话 cookie，等于白做 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;                 # 接口只收坐标和一句话，1M 足够挡住瞎扔的包体

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一次体检是后台任务，前端靠轮询取结果，这里不需要长连接；
        # 60s 是给选址建议这种同步接口留的余量（约 1~3s，网络抖动时也不至于 504）
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 构建产物带 hash，可以长缓存；index.html 必须每次回源，否则改版后用户拿旧壳
    location /assets/ {
        proxy_pass http://fe:80;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
